<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Automation Services</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Automation Services</h1>

        <p>
            I build practical automations that help businesses
            save time and reduce repetitive work.
        </p>
    </header>

    <main>

        <section>
            <h2>What do you need to automate?</h2>

            <p>
                Tell me about a repetitive task or process
                you'd like to improve.
            </p>

            <form id="contactForm">

                <div>
                    <label for="name">Your name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >
                </div>

                <div>
                    <label for="message">What would you like to automate?</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>
                </div>

                <button type="submit">
                    Send Message
                </button>

            </form>

            <p id="responseMessage"></p>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
